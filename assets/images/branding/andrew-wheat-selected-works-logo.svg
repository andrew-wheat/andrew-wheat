  <title id='title'>Andrew Wheat Selected Works logo</title>
  <desc id='desc'>A black geometric logo and Helvetica text lockup with a transparent background. The mark is animated as direct vector states with sequential rectangular cutouts.</desc>
  <defs><style>.mark-frame{opacity:0;fill-rule:evenodd;clip-rule:evenodd;shape-rendering:crispEdges}.wordmark{animation:reveal-wordmark 240ms ease-out 1560ms both;opacity:0}@keyframes reveal-wordmark{from{opacity:0}to{opacity:1}}.mark-frame--0{opacity:1;animation:frame-hide 1ms steps(1,end) 260ms both}.mark-frame--1{animation:frame-show 1ms steps(1,end) 260ms both,frame-hide 1ms steps(1,end) 390ms both}.mark-frame--2{animation:frame-show 1ms steps(1,end) 390ms both,frame-hide 1ms steps(1,end) 520ms both}.mark-frame--3{animation:frame-show 1ms steps(1,end) 520ms both,frame-hide 1ms steps(1,end) 650ms both}.mark-frame--4{animation:frame-show 1ms steps(1,end) 650ms both,frame-hide 1ms steps(1,end) 780ms both}.mark-frame--5{animation:frame-show 1ms steps(1,end) 780ms both,frame-hide 1ms steps(1,end) 910ms both}.mark-frame--6{animation:frame-show 1ms steps(1,end) 910ms both,frame-hide 1ms steps(1,end) 1040ms both}.mark-frame--7{animation:frame-show 1ms steps(1,end) 1040ms both,frame-hide 1ms steps(1,end) 1170ms both}.mark-frame--8{animation:frame-show 1ms steps(1,end) 1170ms both,frame-hide 1ms steps(1,end) 1300ms both}.mark-frame--9{animation:frame-show 1ms steps(1,end) 1300ms both,frame-hide 1ms steps(1,end) 1430ms both}.mark-frame--10{animation:frame-show 1ms steps(1,end) 1430ms both}@keyframes frame-show{from{opacity:0}to{opacity:1}}@keyframes frame-hide{from{opacity:1}to{opacity:0}}@media (prefers-reduced-motion:reduce){.mark-frame{animation:none!important;opacity:0}.mark-frame--10,.wordmark{animation:none!important;opacity:1}}</style></defs>
